# Pipeline do FlexIA Hub: nada entra na branch principal sem passar por tipagem, lint e
# testes dos três serviços. Os testes de backend e do serviço de IA rodam contra um
# PostgreSQL de verdade (com pgvector), igual ao de produção.

stages:
  - test
  - build

variables:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres

.postgres: &postgres
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres

backend:
  stage: test
  image: node:22
  <<: *postgres
  variables:
    TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flexia_hub_test
  cache:
    key: backend-npm
    paths: [backend/.npm]
  script:
    - cd backend
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
  rules:
    - changes: [backend/**/*, .gitlab-ci.yml]

ai-service:
  stage: test
  image: python:3.13
  <<: *postgres
  variables:
    TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flexia_hub_ai_test
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip-cache
  cache:
    key: ai-service-pip
    paths: [.pip-cache]
  script:
    - cd ai-service
    - pip install -r requirements-dev.txt
    - python -m pytest
  rules:
    # as migrações moram no backend e definem o schema que o serviço de IA usa
    - changes: [ai-service/**/*, backend/migrations/**/*, .gitlab-ci.yml]

frontend:
  stage: test
  image: node:22
  cache:
    key: frontend-npm
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
  rules:
    - changes: [frontend/**/*, .gitlab-ci.yml]

# Garante que as três imagens continuam construindo. Só na branch principal.
images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    POSTGRES_PASSWORD: ci
    JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci
    AI_SERVICE_TOKEN: ci
  script:
    - docker compose build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
