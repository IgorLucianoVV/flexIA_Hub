server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança para a aplicação web.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A API fica no mesmo endereço do frontend (sem CORS): o nginx repassa /api ao backend.
    location /api/ {
        # Anexos do catálogo: arquivos de até 25 MB (MAX_UPLOAD_MB no backend) e documentação longa.
        client_max_body_size 30m;
        proxy_request_buffering off;
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;   # perguntas ao assistente e reindexação podem demorar
    }

    # Arquivos com hash no nome nunca mudam: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Aplicação de página única: qualquer rota desconhecida devolve o index.html,
    # que nunca fica em cache (é ele que aponta para os assets da versão atual).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
